apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: color-palette-rep
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /vinio(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: color-palette-rep
                port:
                  number: 8080